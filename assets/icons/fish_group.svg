<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="150" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Originalfisk (din design) -->
    <g id="fish" fill="currentColor" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="56" cy="32" rx="28" ry="18"/>
      <path d="M28 32 L12 22 L12 42 Z" />
      <circle cx="70" cy="28" r="2.8" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Fisk 1 (vänster) -->
  <g transform="translate(20,30) scale(1.0)">
    <use href="#fish"/>
  </g>

  <!-- Fisk 2 (nästan pussas – flyttad närmare, samma höjd) -->
  <g transform="translate(110,30) scale(1.05)">
    <use href="#fish"/>
  </g>

  <!-- Fisk 3 (lite mindre, snett ner) -->
  <g transform="translate(60,85) scale(0.9)">
    <use href="#fish"/>
  </g>
</svg>
